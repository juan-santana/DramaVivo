spring:
  application:
    name: DramaApp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/dramaapp}
      auto-index-creation: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

dramaapp:
  jwt:
    secret: ${JWT_SECRET:dramaAppSecretKeyMustBeLongEnoughForHMACSHA256ComplianceSecurityKey2026!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    issuer: ${JWT_ISSUER:dramaapp-auth}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  rate-limit:
    public-requests-per-minute: ${RATE_LIMIT_PUBLIC:100}
    admin-requests-per-minute: ${RATE_LIMIT_ADMIN:200}
  admin:
    default-username: ${ADMIN_USERNAME:admin}
    default-password: ${ADMIN_PASSWORD:admin123}
  video:
    local-storage-path: ${VIDEO_STORAGE_PATH:E:/DramaApp/media}
    base-playback-url: ${VIDEO_BASE_PLAYBACK_URL:http://localhost:8080/api/media}
